  services:
  - type: web
    name: resume-builder-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: cd backend && python -m uvicorn resume_api.asgi:application --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: resume-builder-backend.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: resume-builder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resume-builder-redis
          property: connectionString
      - key: WEBSOCKET_URL
        value: wss://resume-builder-backend.onrender.com/ws/

  - type: redis
    name: resume-builder-redis
    plan: free
    ipAllowList: []

databases:
  - name: resume-builder-db
    plan: free
